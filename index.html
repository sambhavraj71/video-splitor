<body>

<div class="container">

    <!-- Header with logo -->
    <div class="header">

<script>
    // ==========================================
    // FFmpeg Setup
    // ==========================================
    const { FFmpeg } = FFmpegWASM;
    const { fetchFile, toBlobURL } = FFmpegUtil;

    const ffmpeg = new FFmpeg();
    let ffmpegLoaded = false;

    // ==========================================
    // DOM Elements
    // ==========================================
    const videoInput = document.getElementById("videoInput");
    const video = document.getElementById("video");
    const videoWrapper = document.getElementById("videoWrapper");
    const startBtn = document.getElementById("startBtn");
    const fileName = document.getElementById("fileName");
    const videoDuration = document.getElementById("videoDuration");
    const message = document.getElementById("message");
    const infoMessage = document.getElementById("infoMessage");
    const progressSection = document.getElementById("progressSection");
    const progressFill = document.getElementById("progressFill");
    const progressPercent = document.getElementById("progressPercent");
    const progressLabel = document.getElementById("progressLabel");
    const status = document.getElementById("status");
    const ffmpegStatus = document.getElementById("ffmpegStatus");
    const results = document.getElementById("results");
    const partsList = document.getElementById("partsList");
    const outputFormat = document.getElementById("outputFormat");

    let selectedFile = null;
    let generatedParts = [];
    let isSplitting = false;

    // ==========================================
    // FFmpeg Logger
    // ==========================================
    ffmpeg.on("log", ({ message }) => {
        console.log("[FFmpeg]", message);
    });

    // ==========================================
    // FFmpeg Progress
    // ==========================================
    ffmpeg.on("progress", ({ progress }) => {
        if (isSplitting) {
            const percent = Math.min(100, Math.max(0, progress * 100));
            updateProgress(percent);
        }
    });

    // ==========================================
    // Load FFmpeg
    // ==========================================
    async function loadFFmpeg() {
        if (ffmpegLoaded) return;

        try {
            status.textContent = "Loading FFmpeg...";
            ffmpegStatus.textContent = "First-time setup. Please wait...";
            progressSection.style.display = "block";

            const baseURL = "https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd";

            await ffmpeg.load({
                coreURL: await toBlobURL(`${baseURL}/ffmpeg-core.js`, "text/javascript"),
                wasmURL: await toBlobURL(`${baseURL}/ffmpeg-core.wasm`, "application/wasm")
            });

            ffmpegLoaded = true;
            ffmpegStatus.textContent = "FFmpeg is ready.";

        } catch (error) {
            console.error(error);
            throw new Error("Could not load FFmpeg. Please check your internet connection and try again.");
        }
    }

    // ==========================================
    // Upload Video
    // ==========================================
    videoInput.addEventListener("change", function () {
        const file = this.files[0];
        if (!file) return;

        selectedFile = file;
        generatedParts = [];
        results.style.display = "none";
        hideMessage();
        hideInfo();

        const url = URL.createObjectURL(file);
        video.src = url;
        videoWrapper.style.display = "block";
        fileName.textContent = file.name;
        startBtn.disabled = false;
    });

    // ==========================================
    // Metadata
    // ==========================================
    video.addEventListener("loadedmetadata", function () {
        videoDuration.textContent = formatTime(video.duration);
    });

    // ==========================================
    // Quick Time Buttons
    // ==========================================
    function setTime(seconds) {
        document.getElementById("splitSeconds").value = seconds;
    }

    // ==========================================
    // Main Splitting Function
    // ==========================================
    async function startSplitting() {
        if (!selectedFile) {
            showMessage("Please select a video first.");
            return;
        }
        if (isSplitting) return;

        const splitSeconds = parseFloat(document.getElementById("splitSeconds").value);
        if (!splitSeconds || splitSeconds <= 0) {
            showMessage("Please enter a valid split duration.");
            return;
        }
        if (!video.duration) {
            showMessage("Video metadata is not ready yet.");
            return;
        }

        isSplitting = true;
        startBtn.disabled = true;
        results.style.display = "none";
        generatedParts = [];
        partsList.innerHTML = "";
        progressSection.style.display = "block";
        hideMessage();
        hideInfo();

        try {
            // Load FFmpeg
            await loadFFmpeg();

            // Video information
            const duration = video.duration;
            const totalParts = Math.ceil(duration / splitSeconds);
            const format = outputFormat.value;
            const extension = format;

            progressLabel.textContent = `0 / ${totalParts} parts`;
            updateProgress(0);

            // Input filename
            const inputName = `input_${Date.now()}.${getInputExtension(selectedFile.name)}`;
            await ffmpeg.writeFile(inputName, await fetchFile(selectedFile));

            // Determine processing mode
            const inputExtension = getInputExtension(selectedFile.name);
            const sameContainer = (inputExtension === format);

            if (sameContainer) {
                showInfo("Fast mode: FFmpeg will split without re-encoding whenever possible.");
            } else {
                showInfo(`Format conversion: ${inputExtension.toUpperCase()} → ${format.toUpperCase()}. This requires video encoding and may take longer.`);
            }

            // Create parts
            for (let i = 0; i < totalParts; i++) {
                const start = i * splitSeconds;
                const partDuration = Math.min(splitSeconds, duration - start);
                const partNumber = String(i + 1).padStart(3, "0");
                const outputName = `part_${partNumber}.${extension}`;

                progressLabel.textContent = `Processing Part ${i + 1} of ${totalParts}`;
                status.textContent = `Creating Part ${i + 1}...`;

                // FAST MODE (same container)
                if (sameContainer) {
                    await ffmpeg.exec([
                        "-ss", String(start),
                        "-i", inputName,
                        "-t", String(partDuration),
                        "-map", "0",
                        "-c", "copy",
                        "-avoid_negative_ts", "make_zero",
                        outputName
                    ]);
                }
                // CONVERSION MODE
                else {
                    if (format === "mp4") {
                        await ffmpeg.exec([
                            "-ss", String(start),
                            "-i", inputName,
                            "-t", String(partDuration),
                            "-c:v", "libx264",
                            "-preset", "veryfast",
                            "-crf", "23",
                            "-c:a", "aac",
                            "-movflags", "+faststart",
                            outputName
                        ]);
                    } else {
                        await ffmpeg.exec([
                            "-ss", String(start),
                            "-i", inputName,
                            "-t", String(partDuration),
                            "-c:v", "libvpx-vp9",
                            "-deadline", "realtime",
                            "-cpu-used", "5",
                            "-crf", "32",
                            "-b:v", "0",
                            "-c:a", "libopus",
                            outputName
                        ]);
                    }
                }

                // Read generated file
                const data = await ffmpeg.readFile(outputName);
                const mimeType = format === "mp4" ? "video/mp4" : "video/webm";
                const blob = new Blob([data.buffer], { type: mimeType });

                generatedParts.push({
                    blob: blob,
                    name: `Part ${i + 1}.${extension}`,
                    duration: partDuration
                });

                // Remove temporary output
                try {
                    await ffmpeg.deleteFile(outputName);
                } catch (e) {
                    console.warn("Could not delete temporary file:", e);
                }

                // Progress
                updateProgress(((i + 1) / totalParts) * 100);
            }

            // Delete input
            try {
                await ffmpeg.deleteFile(inputName);
            } catch (e) {
                console.warn("Could not delete input:", e);
            }

            // Complete
            status.textContent = "All parts created successfully!";
            progressLabel.textContent = `${totalParts} / ${totalParts} parts`;
            updateProgress(100);
            displayResults();

        } catch (error) {
            console.error(error);
            showMessage("Error: " + (error.message || "Video processing failed."));
            status.textContent = "Processing failed.";
        } finally {
            isSplitting = false;
            startBtn.disabled = false;
        }
    }

    // ==========================================
    // Get Input Extension
    // ==========================================
    function getInputExtension(filename) {
        const extension = filename.split(".").pop().toLowerCase();
        const allowed = ["mp4", "webm", "mov", "mkv", "avi", "m4v"];
        return allowed.includes(extension) ? extension : "mp4";
    }

    // ==========================================
    // Display Results
    // ==========================================
    function displayResults() {
        results.style.display = "block";
        partsList.innerHTML = "";

        generatedParts.forEach((part, index) => {
            const div = document.createElement("div");
            div.className = "part";

            div.innerHTML = `
                <div class="part-top">
                    <div>
                        <div class="part-name">🎬 ${part.name}</div>
                        <div class="part-duration">Duration: ${formatTime(part.duration)}</div>
                    </div>
                    <button class="download-btn" onclick="downloadPart(${index})">⬇ Download</button>
                </div>
            `;
            partsList.appendChild(div);
        });

        results.scrollIntoView({ behavior: "smooth" });
    }

    // ==========================================
    // Download Single Part
    // ==========================================
    function downloadPart(index) {
        const part = generatedParts[index];
        if (!part) return;

        const url = URL.createObjectURL(part.blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = part.name;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    // ==========================================
    // Download All
    // ==========================================
    async function downloadAll() {
        if (generatedParts.length === 0) return;
        for (let i = 0; i < generatedParts.length; i++) {
            downloadPart(i);
            await sleep(500);
        }
    }

    // ==========================================
    // Progress
    // ==========================================
    function updateProgress(percent) {
        percent = Math.min(100, Math.max(0, percent));
        progressFill.style.width = percent + "%";
        progressPercent.textContent = Math.round(percent) + "%";
    }

    // ==========================================
    // Format Time
    // ==========================================
    function formatTime(seconds) {
        if (!isFinite(seconds)) return "00:00";
        seconds = Math.floor(seconds);
        const hrs = Math.floor(seconds / 3600);
        const mins = Math.floor((seconds % 3600) / 60);
        const secs = seconds % 60;

        if (hrs > 0) {
            return String(hrs).padStart(2, "0") + ":" +
                   String(mins).padStart(2, "0") + ":" +
                   String(secs).padStart(2, "0");
        }
        return String(mins).padStart(2, "0") + ":" +
               String(secs).padStart(2, "0");
    }

    // ==========================================
    // Sleep
    // ==========================================
    function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    // ==========================================
    // Messages
    // ==========================================
    function showMessage(text) {
        message.textContent = text;
        message.style.display = "block";
    }

    function hideMessage() {
        message.style.display = "none";
    }

    function showInfo(text) {
        infoMessage.textContent = text;
        infoMessage.style.display = "block";
    }

    function hideInfo() {
        infoMessage.style.display = "none";
    }

</script>

</body>
</html>
